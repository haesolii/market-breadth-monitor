name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://api.stlouisfed.org/fred/series/observations?series_id=UNRATE&file_type=json" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=UNRATE"; do
            echo "== $u"; curl -s -m 20 -o /dev/null -w "http=%{http_code} time=%{time_total}\n" "$u" || echo "curl failed ($?)"
          done
      - env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          host=$(echo "$URL" | sed -E 's#.*@([^:/]+).*#\1#'); echo "db host: $host"
