name: Refresh data

# Collect + compute, then publish results to Supabase (when configured).
# Cron is UTC: 23:15 = after the US close is final (19:15 EDT / 18:15 EST),
# 09:40 = after the Korean close (18:40 KST). GitHub delays scheduled runs by hours or drops
# them, so a 5-minute cron never actually ran: instead one run keeps refreshing every
# 5 minutes for as long as Korea (09:00-18:00 KST) or the US (09:30-18:00 ET) is open or not yet
# final (--live publishes provisional values), and the hourly starters only need one of them to
# fire per session. Extra starters queue behind the running loop and finish in one quick pass.
on:
  schedule:
    - cron: "15 23 * * *"
    - cron: "40 9 * * *"
    - cron: "7 0-8 * * 1-5"
    - cron: "7 13-22 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HAS_SUPABASE: ${{ secrets.SUPABASE_DB_URL != '' }}
      HAS_TELEGRAM: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
      HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # data/ (bars, universes, status) persists between runs; a cache miss only
      # means a full ~5-minute backfill.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Pull dashboard settings
        if: env.HAS_SUPABASE == 'true'
        continue-on-error: true  # collection still runs; the publish step reports DB problems
        env:
          DATA_DIR: ${{ github.workspace }}/data
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m app.publish --pull-config

      # Refresh + publish, then again every 5 minutes while a market session is live
      # (GitHub caps a job at 6 h; stop after ~5 h 30 m so the data cache still saves).
      - name: Collect, compute and publish
        env:
          DATA_DIR: ${{ github.workspace }}/data
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          start=$(date +%s); fails=0
          while :; do
            if python -m app.refresh --only-stale --live && { [ "$HAS_SUPABASE" != true ] || python -m app.publish; }; then
              fails=0
            else
              fails=$((fails + 1)); echo "::warning::pass failed ($fails in a row)"
              [ $fails -ge 3 ] && exit 1
            fi
            live=$(python -c "from app.market_calendar import live_session, CALENDARS; print(int(any(live_session(cal=c) for c in CALENDARS)))")
            [ "$live" = 1 ] && [ $(( $(date +%s) - start )) -lt 19800 ] || break
            sleep $(( 300 - $(date +%s) % 300 ))
          done
          [ $fails -eq 0 ]

      # After each market's final run (US: 23:15 UTC, Korea: 09:40 UTC) or a manual run: Claude
      # writes a brief from the published numbers, then it is published and sent to Telegram.
      - name: AI brief
        if: success() && env.HAS_ANTHROPIC == 'true' && (github.event.schedule == '15 23 * * *' || github.event.schedule == '40 9 * * *' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          DATA_DIR: ${{ github.workspace }}/data
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m app.brief --slot ${{ github.event.schedule == '40 9 * * *' && 'kr' || 'us' }}
          if [ "$HAS_SUPABASE" = true ]; then python -m app.publish; fi
          if [ "$HAS_TELEGRAM" = true ]; then python -m app.report --brief; fi

      # Breadth extremes newly reached on a final session (deduped per source and session).
      - name: Signal alerts
        if: success() && env.HAS_TELEGRAM == 'true'
        continue-on-error: true
        env:
          DATA_DIR: ${{ github.workspace }}/data
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.report --signals

      # Morning run (after the US close) or manual run: usage + data report to Telegram.
      - name: Daily report
        if: success() && env.HAS_TELEGRAM == 'true' && (github.event.schedule == '15 23 * * *' || github.event_name == 'workflow_dispatch')
        env:
          DATA_DIR: ${{ github.workspace }}/data
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.report

      # Hourly intraday starters don't alert, or one outage would flood the chat.
      - name: Failure alert
        if: failure() && env.HAS_TELEGRAM == 'true' && !startsWith(github.event.schedule, '7 ')
        env:
          DATA_DIR: ${{ github.workspace }}/data
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.report --alert "데이터 갱신 실패 — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summary
        if: always()
        env:
          DATA_DIR: ${{ github.workspace }}/data
        run: |
          python - <<'EOF'
          import json, os
          p = os.path.join(os.environ["DATA_DIR"], "status.json")
          st = json.load(open(p, encoding="utf-8")) if os.path.exists(p) else {}
          for k, v in st.get("sources", {}).items():
              print(f"{k:12} last_success={v.get('last_success')} error={v.get('last_error')} result={v.get('result')}")
          EOF
